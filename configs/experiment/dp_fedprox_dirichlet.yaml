# @package _global_
# configs/experiment/dp_fedprox_dirichlet.yaml
# Federated DP-SGD with FedProx proximal regularization on DermaMNIST non-IID splits.

experiment_name: dp_fedprox_dirichlet
dataset: dermamnist
image_size: 28
num_classes: 7

model:
  name: minicnn
  dropout: 0.4

federation:
  algorithm: dp_fedprox
  mu: 0.01                # FedProx proximal penalty weight
  num_clients: 10
  clients_per_round: 5
  rounds: 20
  dirichlet_alpha: 0.3
  min_samples_per_client: 5

local_training:
  epochs: 3
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-4

privacy:
  noise_multiplier: 1.0   # Gaussian noise std multiplier (sigma)
  max_grad_norm: 1.0      # L2 gradient clipping threshold (C)
  target_delta: 1.0e-5    # Target delta for DP accounting

output_dir: results/federated_dp_fedprox
