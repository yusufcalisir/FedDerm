# configs/experiments/centralized_baseline.yaml
# Phase 2: Centralized training on DermaMNIST (to be filled in Phase 2).
# Placeholder — structure mirrors what the trainer will consume.

experiment_name: centralized_baseline
dataset: dermamnist
image_size: 64          # DermaMNIST default resolution
num_classes: 7

model:
  backbone: resnet18    # lightweight CNN baseline
  pretrained: false

training:
  epochs: 50
  batch_size: 128
  lr: 1.0e-3
  optimizer: adam
  weight_decay: 1.0e-4
  scheduler: cosine

output_dir: results/centralized_baseline
