[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedderm"
version = "0.1.0"
description = "Federated learning for privacy-preserving skin lesion classification (FedDerm research project)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "FedDerm Research" },
]
keywords = ["federated-learning", "differential-privacy", "medical-imaging", "dermatology"]

dependencies = [
  # Core deep learning
  "torch>=2.2",
  "torchvision>=0.17",

  # Federated learning framework
  "flwr[simulation]>=1.8",

  # Differential privacy
  "opacus>=1.4",

  # Medical imaging benchmark dataset
  "medmnist>=3.0",

  # ML utilities
  "scikit-learn>=1.4",
  "numpy>=1.26",

  # Visualization
  "matplotlib>=3.8",
  "seaborn>=0.13",

  # Config management (Hydra for experiment configs in later phases)
  "hydra-core>=1.3",
  "omegaconf>=2.3",

  # Experiment tracking (optional but useful from Phase 2 onward)
  "wandb>=0.17",

  # Misc utilities
  "tqdm>=4.66",
  "Pillow>=10.0",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=24.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "ipykernel>=6.29",
  "jupyterlab>=4.1",
]

# LoRA / PEFT (Phase 5 — installed separately when needed)
peft = [
  "peft>=0.10",
  "transformers>=4.40",
  "timm>=0.9",
]

[project.urls]
Repository = "https://github.com/placeholder/fedderm"

# ── Tool configurations ────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
